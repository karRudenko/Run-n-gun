<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>пж зарегай 3</title>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090b0f;--surf:#0d1117;--brd:#1e2d40;
  --acc:#00e5ff;--red:#ff3c5f;--grn:#39ff14;--org:#ff9f1c;
  --txt:#c8d8e8;--mut:#4a6070;
  --mono:'Share Tech Mono',monospace;
  --ui:'Rajdhani',sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ui)}
.screen{display:none;width:100%;height:100%;position:absolute;inset:0}
.screen.active{display:flex}

/* ── REGISTER ── */
#sr{flex-direction:column;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
#sr::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(0deg,transparent,transparent 39px,var(--brd) 39px,var(--brd) 40px),
             repeating-linear-gradient(90deg,transparent,transparent 39px,var(--brd) 39px,var(--brd) 40px)}
.rbox{position:relative;z-index:1;width:360px;background:var(--surf);border:1px solid var(--brd);border-top:2px solid var(--acc);padding:36px 30px 30px}
.logo{font-family:var(--ui);font-weight:700;font-size:38px;letter-spacing:9px;color:var(--acc);text-align:center;margin-bottom:2px}
.logo-s{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:center;letter-spacing:4px;margin-bottom:30px}
.fl{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:6px}
.fi{width:100%;background:var(--bg);border:1px solid var(--brd);border-bottom:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-size:17px;padding:8px 10px;outline:none}
.fi:focus{box-shadow:0 0 0 1px var(--acc)}
.jbtn{width:100%;margin-top:24px;padding:12px;background:transparent;border:1px solid var(--acc);color:var(--acc);font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:background .14s,color .14s}
.jbtn:hover{background:var(--acc);color:var(--bg)}
.jbtn:disabled{opacity:.4;cursor:not-allowed}
.st{font-family:var(--mono);font-size:12px;margin-top:10px;text-align:center;min-height:16px}
.st.e{color:var(--red)}.st.ok{color:var(--grn)}

/* ── GAME ── */
#sg{flex-direction:column}
.hud{height:40px;min-height:40px;background:var(--surf);border-bottom:1px solid var(--brd);
     display:flex;align-items:center;padding:0 12px;gap:0;flex-shrink:0;overflow:hidden}
.hdot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:bl 1.2s infinite;flex-shrink:0;margin-right:10px}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.1}}
.hnick{font-family:var(--mono);font-size:12px;color:var(--acc);white-space:nowrap;margin-right:16px}
.hnick em{color:var(--mut);font-style:normal;font-size:10px;margin-right:3px}
.hdbg{display:flex;gap:14px;margin-left:auto;align-items:center}
.hd-item{display:flex;flex-direction:column;align-items:flex-end}
.hd-label{font-family:var(--mono);font-size:9px;color:var(--mut);letter-spacing:1px;line-height:1}
.hd-val{font-family:var(--mono);font-size:12px;line-height:1.2}
.hd-val.acc{color:var(--acc)}.hd-val.grn{color:var(--grn)}.hd-val.red{color:var(--red)}.hd-val.org{color:var(--org)}
.hd-sep{width:1px;height:24px;background:var(--brd);flex-shrink:0}

.gwrap{flex:1;position:relative;overflow:hidden;cursor:crosshair}
#cv{display:block;position:absolute;inset:0}


.wpanel{
  position:absolute;bottom:14px;left:14px;
  background:rgba(9,11,15,.88);
  border:1px solid var(--brd);border-left:2px solid var(--org);
  padding:10px 14px 10px 12px;
  pointer-events:none;min-width:180px;
}
.wp-name{font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:3px;color:var(--org);margin-bottom:6px}
.wp-ammo-row{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.wp-ammo-cur{font-family:var(--mono);font-size:22px;color:var(--txt)}
.wp-ammo-sep{font-family:var(--mono);font-size:13px;color:var(--mut)}
.wp-ammo-max{font-family:var(--mono);font-size:13px;color:var(--mut)}
.wp-ammo-cur.low{color:var(--red);animation:ammofl .4s infinite alternate}
@keyframes ammofl{from{opacity:1}to{opacity:.4}}
.wp-reload{font-family:var(--mono);font-size:10px;color:var(--red);letter-spacing:2px;margin-bottom:6px;height:13px}
.wp-label{font-family:var(--mono);font-size:9px;color:var(--mut);letter-spacing:2px;margin-bottom:4px}

.wp-pips{display:flex;gap:3px;flex-wrap:wrap;max-width:160px}
.pip{width:7px;height:3px;background:var(--org);border-radius:1px;transition:background .1s}
.pip.empty{background:var(--mut)}

.wp-recoil-track{width:100%;height:4px;background:var(--brd);border-radius:2px;margin-top:6px;position:relative;overflow:hidden}
.wp-recoil-fill{height:100%;border-radius:2px;transition:width .12s linear;background:linear-gradient(90deg,var(--grn),var(--org),var(--red))}
.wp-recoil-label{display:flex;justify-content:space-between;margin-top:3px}
.wp-recoil-text{font-family:var(--mono);font-size:9px;color:var(--mut)}
.wp-recoil-val{font-family:var(--mono);font-size:9px}

.plist{position:absolute;top:8px;right:8px;width:170px;background:rgba(13,17,23,.92);
       border:1px solid var(--brd);border-top:1px solid var(--acc);padding:8px 10px;pointer-events:none}
.pt{font-family:var(--mono);font-size:9px;color:var(--mut);letter-spacing:2px;margin-bottom:6px}
.pe{display:flex;align-items:center;gap:5px;padding:2px 0;font-family:var(--mono);font-size:11px;border-bottom:1px solid rgba(30,45,64,.4)}
.pe:last-child{border-bottom:none}
.pdm{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}
.pdo{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0}
.pn{color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp{color:var(--mut);font-size:9px}
.pid{color:var(--mut);font-size:9px;margin-right:4px}
.pscore{font-family:var(--mono);font-size:11px;color:var(--acc);margin-left:auto;padding-left:6px;flex-shrink:0}
.prank{font-family:var(--mono);font-size:9px;color:var(--mut);width:14px;flex-shrink:0;text-align:right;margin-right:4px}
.prank.gold{color:#ffd700}.prank.silver{color:#b0b8c8}.prank.bronze{color:#cd7f32}
.pe.is-me{border-left:2px solid var(--acc);padding-left:3px;background:rgba(0,229,255,.04)}
.plist-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pt-count{font-family:var(--mono);font-size:9px;color:var(--mut)}

#ov{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;z-index:50;transition:opacity .35s}
#ov.gone{opacity:0;pointer-events:none}
.spin{width:36px;height:36px;border:2px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ovt{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:2px}

.kf{position:absolute;bottom:8px;left:8px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.km{font-family:var(--mono);font-size:11px;color:var(--mut);background:rgba(13,17,23,.75);
    padding:1px 7px;opacity:0;animation:kfi 3s ease forwards}
@keyframes kfi{0%{opacity:0;transform:translateX(-5px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.hpbar-wrap{
  display:flex;align-items:center;gap:8px;
  padding:0 14px 0 10px;border-left:1px solid var(--brd);
}
.hpbar-plus{
  font-family:var(--mono);font-size:16px;font-weight:700;
  color:var(--grn);line-height:1;flex-shrink:0;
  animation:hpbl 1.1s ease-in-out infinite;
  text-shadow:0 0 8px var(--grn);
}
@keyframes hpbl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.8)}}
.hpbar-col{display:flex;flex-direction:column;gap:3px;min-width:90px}
.hpbar-label{font-family:var(--mono);font-size:9px;color:var(--mut);letter-spacing:1px;line-height:1}
.hpbar-track{width:90px;height:6px;background:var(--brd);border-radius:3px;overflow:hidden}
.hpbar-fill{height:100%;border-radius:3px;transition:width .2s ease,background .3s}
.hpbar-val{font-family:var(--mono);font-size:10px;line-height:1}


#dead-ov{
  position:absolute;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(9,11,15,.82);
  pointer-events:none;opacity:0;transition:opacity .4s;
}
#dead-ov.show{opacity:1}
.dead-title{
  font-family:var(--ui);font-weight:700;font-size:52px;
  letter-spacing:12px;color:var(--red);
  text-shadow:0 0 30px rgba(255,60,95,.6),0 0 60px rgba(255,60,95,.25);
  animation:deadfl .7s ease-in-out infinite alternate;
}
@keyframes deadfl{from{opacity:1}to{opacity:.55}}
.dead-sub{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:3px}
.dead-timer{
  font-family:var(--mono);font-size:38px;font-weight:700;color:var(--org);
  letter-spacing:4px;
  text-shadow:0 0 20px rgba(255,159,28,.5);
  min-width:3ch;text-align:center;
}
.dead-bar-wrap{width:220px}
.dead-bar-track{width:100%;height:3px;background:var(--brd);border-radius:2px;overflow:hidden;margin-top:4px}
.dead-bar-fill{height:100%;border-radius:2px;background:var(--org);transition:width .15s linear}


.fi-row{display:flex;gap:10px}
.fi-col{display:flex;flex-direction:column}
.fi-col-grow{flex:1}
.fi-col-port{width:82px}
</style>
</head>
<body>

<div class="screen active" id="sr">
  <div class="rbox">
    <div class="logo">Run `n gun</div>
    <div class="fi-row">
      <div class="fi-col fi-col-grow">
        <label class="fl" for="srv-ip">SERVER IP</label>
        <input class="fi" id="srv-ip" type="text" placeholder="127.0.0.1" value="localhost" autocomplete="off" spellcheck="false">

      <label class="fl" for="nick">NICKNAME</label>

    </div>
    <button class="jbtn" id="bjoin">[ JOIN SERVER ]</button>
    <div class="st" id="st"></div>
  </div>
</div>

<div class="screen" id="sg">
  <div class="hud">
    <div class="hdot"></div>
    <div class="hnick"><em>PLAYER//</em><span id="hnick">—</span></div>
    <div class="hdbg">



      <div class="hd-sep"></div>
      <div class="hd-item">
        <span class="hd-label">FPS</span>
        <span class="hd-val grn" id="h-fps">—</span>
      </div>

    </div>
    
    <div class="hpbar-wrap" id="hpbar-wrap">
      <span class="hpbar-plus">+</span>
      <div class="hpbar-col">
        <span class="hpbar-label">HEALTH</span>
        <div class="hpbar-track"><div class="hpbar-fill" id="hpbar-fill" style="width:100%;background:#39ff14"></div></div>
        <span class="hpbar-val" id="hpbar-val" style="color:#39ff14">100</span>
      </div>
    </div>
  </div>
  <div class="gwrap" id="gwrap">
    <canvas id="cv"></canvas>

    
    <div id="dead-ov">
      <div class="dead-title">YOU DIED</div>
      <div class="dead-sub">// RESPAWNING IN</div>
      <div class="dead-timer" id="dead-timer">—</div>
      <div class="dead-bar-wrap">
        <div class="dead-bar-track"><div class="dead-bar-fill" id="dead-bar-fill" style="width:100%"></div></div>
      </div>
    </div>

    
    <div class="wpanel" id="wpanel">
      <div class="wp-name" id="wp-name">—</div>
      <div class="wp-ammo-row">
        <span class="wp-ammo-cur" id="wp-ammo-cur">—</span>
        <span class="wp-ammo-sep">/</span>
        <span class="wp-ammo-max" id="wp-ammo-max">—</span>
      </div>
      <div class="wp-reload" id="wp-reload"></div>
      <div class="wp-label">ROUNDS</div>
      <div class="wp-pips" id="wp-pips"></div>
      <div class="wp-recoil-track"><div class="wp-recoil-fill" id="wp-recoil-fill" style="width:0%"></div></div>
      <div class="wp-recoil-label">
        <span class="wp-recoil-text">RECOIL</span>
        <span class="wp-recoil-val" id="wp-recoil-val" style="color:#39ff14">0°</span>
      </div>
    </div>

    <div class="plist"><div class="plist-hdr"><span class="pt">// SCOREBOARD</span><span class="pt-count" id="ponline">0 online</span></div><div id="plb"></div></div>
    <div class="kf" id="kf"></div>
    <div id="ov"><div class="spin"></div><div class="ovt">CONNECTING...</div></div>
  </div>
</div>

<script>
'use strict';


let API            = 'http://localhost:8080/game'; 
let WS_URL         = 'http://localhost:8080/ws';   
let stompClient    = null;


const INPUT_HZ     = 64;
const INPUT_MS     = 1000 / INPUT_HZ;
const SCALE        = 40;
const RAY_LEN      = 0.55;
const RAY_SPEED    = 70;



const INTERP_TICKS_MIN = 2;
const INTERP_TICKS_MAX = 4;



const SNAPSHOT_BUFFER_LEN = 32;


const SERVER_DT_INIT = 15.6;


const SERVER_DT_WINDOW = 24;
const SERVER_DT_SMOOTH = 0.25;



const SERVER_DT_OUTLIER_MUL = 4;




const PLAYBACK_CATCHUP   = 1.15;
const PLAYBACK_SLOWDOWN  = 0.85;




const TELEPORT_DIST = 5.0;




const G = {
  nick: '',
  myId: null,
  ready: false,
  registered: false,   

  
  px: 0, py: 0,        
  rotation: 0,         
  polyOff: [],         
  weapon: null,

  
  
  
  snapshots: [],

  
  
  serverDt: SERVER_DT_INIT,

  
  dtSamples: [],

  
  
  
  
  
  targetInterpTicks: INTERP_TICKS_MIN,
  jitterEstimate: 0,        

  
  
  
  
  playIdx: 0,
  playFrac: 0,
  playbackStarted: false,

  tickSentAt: 0,
  rtt: 0,
  lastInputSentT: 0,        

  shots: [],

  
  health: 100,
  maxHealth: 100,
  isDead: false,
  timeToRevive: 0,
  reviveTotal: 0,

  
  walls: [],
  wallsById: new Map(),

  keys: {},
  edgePending: {},   
  mX: 0, mY: 0,
  mL: false, mR: false,

  camX: 0, camY: 0,
  camInitialized: false,
  W: 0, H: 0,
  prevFrame: 0,
  fpsCount: 0, fpsTimer: 0,

  
  lastDrawnPx: 0, lastDrawnPy: 0, lastSpeedT: 0,
  lastServerPx: 0, lastServerPy: 0, lastServerSpeedT: 0,

  
  scoreNames:  [],   
  scoreValues: [],   
};




const $   = id => document.getElementById(id);
const pi2 = Math.PI * 2;

function showScr(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function setSt(msg, cls) {
  const e = $('st'); e.textContent = msg; e.className = 'st '+(cls||'');
}

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI)  d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}




let renderedSelf  = null;        
let renderedOthers = [];         

function findEntityById(id) {
  if (id === G.myId && renderedSelf) return { x: renderedSelf.x, y: renderedSelf.y, isWall: false };
  for (const o of renderedOthers) if (o.id === id) return { x: o.x, y: o.y, isWall: false };
  const w = G.wallsById.get(id);
  if (w) return { x: w.cx, y: w.cy, isWall: true };
  return null;
}



function parseWalls(rawWalls) {
  if (!rawWalls || !rawWalls.length) return;
  G.walls = rawWalls.map(w => {
    const p = w.polygons || [];
    const verts = [];
    for (let i = 0; i < p.length; i += 2) verts.push({ x: p[i], y: p[i+1] });
    const cx = verts.reduce((s, v) => s + v.x, 0) / verts.length;
    const cy = verts.reduce((s, v) => s + v.y, 0) / verts.length;
    return { id: w.id, verts, cx, cy };
  });
  G.wallsById = new Map(G.walls.map(w => [w.id, w]));
}




const MAX_RECOIL_DEG = 45;

function updateWeaponHUD(w) {
  if (!w) return;
  $('wp-name').textContent = w.name || '—';
  const cur = w.ammo ?? 0;
  const max = w.maxAmmo ?? 0;
  const curEl = $('wp-ammo-cur');
  curEl.textContent = cur;
  curEl.className = 'wp-ammo-cur' + (cur <= Math.ceil(max * 0.25) && cur > 0 ? ' low' : '');
  $('wp-ammo-max').textContent = max;
  $('wp-reload').textContent = w.isRealoading ? '⟳ RELOADING...' : '';
  const pipsEl = $('wp-pips');
  const show = Math.min(max, 30);
  if (pipsEl.children.length !== show) {
    pipsEl.innerHTML = '';
    for (let i = 0; i < show; i++) {
      const p = document.createElement('div'); p.className = 'pip'; pipsEl.appendChild(p);
    }
  }
  const ratio = max > 0 ? cur / max : 0;
  const filled = Math.round(ratio * show);
  Array.from(pipsEl.children).forEach((p, i) => {
    p.className = 'pip' + (i < filled ? '' : ' empty');
  });
  const recoilDeg = w.recoil ?? 0;
  const pct = Math.min(100, (recoilDeg / MAX_RECOIL_DEG) * 100);
  $('wp-recoil-fill').style.width = pct + '%';
  const rv = $('wp-recoil-val');
  rv.textContent = recoilDeg.toFixed(1) + '°';
  if (pct < 30)      rv.style.color = '#39ff14';
  else if (pct < 65) rv.style.color = '#ff9f1c';
  else               rv.style.color = '#ff3c5f';
}




function updateHealthHUD() {
  const hp    = Math.max(0, G.health);
  const maxHp = G.maxHealth || 100;
  const pct   = Math.min(100, (hp / maxHp) * 100);

  const fill = $('hpbar-fill');
  const val  = $('hpbar-val');
  fill.style.width = pct + '%';

  
  let col;
  if (pct > 60)      col = '#39ff14';
  else if (pct > 30) col = '#ff9f1c';
  else               col = '#ff3c5f';
  fill.style.background = col;
  val.style.color = col;
  val.textContent = Math.ceil(hp);

  
  const ov = $('dead-ov');
  if (G.isDead) {
    ov.classList.add('show');
    const secLeft = Math.ceil(G.timeToRevive / 1000);
    $('dead-timer').textContent = secLeft > 0 ? secLeft + 's' : '...';
    const total = G.reviveTotal > 0 ? G.reviveTotal : 1;
    const barPct = Math.min(100, (G.timeToRevive / total) * 100);
    $('dead-bar-fill').style.width = barPct + '%';
  } else {
    ov.classList.remove('show');
  }
}




$('bjoin').addEventListener('click', doReg);
['nick','srv-ip','srv-port'].forEach(id => {
  $(id).addEventListener('keydown', e => { if (e.key==='Enter') doReg(); });
});

function doReg() {
  const nick = $('nick').value.trim();
  if (!nick) return setSt('enter a callsign','e');
  const ip   = $('srv-ip').value.trim()   || 'localhost';
  const port = $('srv-port').value.trim() || '8080';
  if (!/^\d+$/.test(port) || +port < 1 || +port > 65535)
    return setSt('invalid port','e');
  API    = `http://${ip}:${port}/game`;
  WS_URL = `http://${ip}:${port}/ws`;
  $('bjoin').disabled = true;

  
  
  if (G.registered && G.nick === nick) {
    setSt('reconnecting socket...','');
    openSocketFlow();
    return;
  }

  setSt('connecting...','');
  fetch(API+'/register', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name: nick}),
  })
  .then(r => r.json())
  .then(ok => {
    if (ok) {
      G.nick = nick;
      G.registered = true;
      setSt('ACCESS GRANTED // opening socket...','ok');
      openSocketFlow();
    } else {
      setSt('nickname taken or error','e');
      $('bjoin').disabled = false;
    }
  })
  .catch(e => { setSt('unreachable — '+e.message,'e'); $('bjoin').disabled = false; });
}

function openSocketFlow() {
  connectSocket(
    () => { setTimeout(startGame, 300); },
    (reason) => {
      setSt('socket failed: '+reason,'e');
      $('bjoin').disabled = false;
    }
  );
}




function connectSocket(onReady, onFail) {
  
  if (stompClient) {
    try { stompClient.deactivate(); } catch(e){}
    stompClient = null;
  }

  let settled = false;
  const finish = (ok, reason) => {
    if (settled) return;
    settled = true;
    clearTimeout(toId);
    if (ok) onReady && onReady();
    else    onFail  && onFail(reason || 'unknown');
  };

  const toId = setTimeout(() => finish(false, 'timeout'), 7000);

  try {
    stompClient = new StompJs.Client({
      webSocketFactory: () => new SockJS(WS_URL),
      reconnectDelay: 2000,
      heartbeatIncoming: 10000,
      heartbeatOutgoing: 10000,
      debug: msg => console.log('[STOMP]', msg),
    });

    stompClient.onConnect = () => {
      
      
      
      
      
      
      
      
      const topic = '/return/data/' + G.nick;
      stompClient.subscribe(topic, msg => {
        try {
          const data = JSON.parse(msg.body);
          onServer(data);
        } catch (e) {
          console.warn('bad frame', e);
        }
      });
      finish(true);
    };

    stompClient.onStompError = frame => {
      console.error('STOMP error', frame.headers['message'], frame.body);
      finish(false, frame.headers['message'] || 'stomp error');
    };

    
    
    
    stompClient.onWebSocketClose = evt => {
      
      
      console.log('ws closed', evt && evt.code);
    };

    stompClient.onWebSocketError = err => {
      console.error('ws error', err);
      
      
    };

    stompClient.activate();
  } catch (e) {
    console.error(e);
    finish(false, e.message);
  }
}




let canvas, ctx;

function startGame() {
  $('hnick').textContent = G.nick;
  showScr('sg');
  canvas = $('cv');
  ctx    = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
  bindInput();
  const now = performance.now();
  G.prevFrame  = now;
  G.fpsTimer   = now;
  G.lastSpeedT = now;
  G.lastServerSpeedT = now;
  G.lastInputSentT   = 0;     
  requestAnimationFrame(frame);
  setTimeout(() => $('ov').classList.add('gone'), 1500);
}

function resize() {
  const w = $('gwrap');
  canvas.width  = G.W = w.clientWidth;
  canvas.height = G.H = w.clientHeight;
}




function bindInput() {
  
  
  const EDGE_KEYS = new Set(['KeyR']);

  document.addEventListener('keydown', e => {
    
    
    if (EDGE_KEYS.has(e.code) && !e.repeat && !G.keys[e.code]) {
      G.edgePending[e.code] = true;
    }
    G.keys[e.code] = true;
  });
  document.addEventListener('keyup',   e => { G.keys[e.code] = false; });
  
  
  
  window.addEventListener('blur', () => {
    G.keys = {};
    G.edgePending = {};
    G.mL = false; G.mR = false;
  });
  const w = $('gwrap');
  w.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    G.mX = e.clientX - r.left;
    G.mY = e.clientY - r.top;
  });
  w.addEventListener('mousedown',   e => { if(e.button===0) G.mL=true;  if(e.button===2) G.mR=true;  });
  w.addEventListener('mouseup',     e => { if(e.button===0) G.mL=false; if(e.button===2) G.mR=false; });
  w.addEventListener('contextmenu', e => e.preventDefault());
  w.addEventListener('mouseleave',  () => { G.mL=false; G.mR=false; });
}






function tick() {
  if (!stompClient || !stompClient.connected) return;

  G.tickSentAt = performance.now();
  
  
  
  const mxw = G.W > 0 ?  (G.mX - G.W/2) / SCALE : 0;
  const myw = G.H > 0 ? -((G.mY - G.H/2) / SCALE) : 0;

  
  
  
  
  
  const popEdge = (code) => {
    if (G.edgePending[code]) { G.edgePending[code] = false; return true; }
    return false;
  };

  const payload = {
    nickName: G.nick,
    data: {
      forwardHolded:    !!(G.keys['KeyW']    || G.keys['ArrowUp']),
      rightHolded:      !!(G.keys['KeyD']    || G.keys['ArrowRight']),
      leftHolded:       !!(G.keys['KeyA']    || G.keys['ArrowLeft']),
      backHolded:       !!(G.keys['KeyS']    || G.keys['ArrowDown']),
      leftMouseHolded:  !!G.mL,
      rightMouseHolded: !!G.mR,
      
      reloadPressed:    popEdge('KeyR'),
      
      
      
      
      
      
      numPressed: [
        !!G.keys['Digit0'],   
        !!G.keys['Digit1'],   
        !!G.keys['Digit2'],
        !!G.keys['Digit3'],
        !!G.keys['Digit4'],
        !!G.keys['Digit5'],
        !!G.keys['Digit6'],
        !!G.keys['Digit7'],
        !!G.keys['Digit8'],
        !!G.keys['Digit9'],   
      ],
      mousePosX:  mxw,
      mousePosY:  myw,
    }
  };

  try {
    stompClient.publish({
      destination: '/game/input',
      body: JSON.stringify(payload),
    });
  } catch (e) {
    
  }
}







function onServer(data) {
  $('ov').classList.add('gone');
  const now = performance.now();

  
  
  
  
  
  if (G.tickSentAt > 0) {
    const dt = now - G.tickSentAt;
    if (dt < 200) {
      G.rtt = Math.round(dt);
    }
  }

  
  if (data.walls && data.walls.length && G.walls.length === 0) parseWalls(data.walls);

  
  
  
  
  
  let me = null;
  if (data.myPlayer) {
    const sp = data.myPlayer;
    if (sp.id !== undefined) G.myId = sp.id;
    me = {
      id:       sp.id,
      x:        sp.x,
      y:        sp.y,
      rotation: (sp.rotation ?? 0) * Math.PI / 180,
      poly:     sp.polygons || [],
      health:   sp.health ?? 100,
      timeToRevive: sp.timeToRevive ?? 0,
      xSpeed:   sp.xSpeed || 0,
      ySpeed:   sp.ySpeed || 0,
      weapon:   sp.weapon || null,
    };
  }

  const others = new Map();
  (data.players || []).forEach(p => {
    if (p.id === undefined) return;
    others.set(p.id, {
      id:       p.id,
      name:     p.name,
      x:        p.x,
      y:        p.y,
      rotation: (p.rotation ?? 0) * Math.PI / 180,
      poly:     p.polygons || [],
    });
  });

  
  if (data.mapDTO) {
    G.scoreNames  = data.mapDTO.names  || [];
    G.scoreValues = data.mapDTO.scores || [];
  }

  
  
  
  if (G.snapshots.length > 0) {
    const prevRecv = G.snapshots[G.snapshots.length - 1].tRecv;
    const dtRecv = now - prevRecv;
    const outlierLimit = G.serverDt * SERVER_DT_OUTLIER_MUL;
    if (dtRecv > 0 && dtRecv < outlierLimit) {
      G.dtSamples.push(dtRecv);
      if (G.dtSamples.length > SERVER_DT_WINDOW) G.dtSamples.shift();
      
      const sorted = [...G.dtSamples].sort((a, b) => a - b);
      const median = sorted[Math.floor(sorted.length / 2)];
      G.serverDt = G.serverDt * (1 - SERVER_DT_SMOOTH) + median * SERVER_DT_SMOOTH;

      
      let jitterSum = 0;
      for (const s of G.dtSamples) jitterSum += Math.abs(s - G.serverDt);
      G.jitterEstimate = jitterSum / G.dtSamples.length;

      
      
      
      const jitterTicks = G.jitterEstimate / G.serverDt;
      const target = Math.ceil(INTERP_TICKS_MIN + jitterTicks);
      G.targetInterpTicks = Math.max(
        INTERP_TICKS_MIN,
        Math.min(INTERP_TICKS_MAX, target)
      );
    }
  }

  
  G.snapshots.push({ tRecv: now, me, others });
  while (G.snapshots.length > SNAPSHOT_BUFFER_LEN) {
    G.snapshots.shift();
    
    
    if (G.playIdx > 0) {
      G.playIdx--;
      
      
    }
  }

  

  
  
  if (!G.ready && me && G.snapshots.length >= INTERP_TICKS_MIN + 1) {
    G.playIdx       = 0;        
    G.playFrac      = 0;
    G.playbackStarted = true;
    G.camX          = me.x;
    G.camY          = me.y;
    G.camInitialized = true;
    G.px            = G.snapshots[0].me ? G.snapshots[0].me.x : me.x;
    G.py            = G.snapshots[0].me ? G.snapshots[0].me.y : me.y;
    G.lastServerPx  = me.x;
    G.lastServerPy  = me.y;
    G.lastServerSpeedT = now;
    G.ready         = true;
  }

  
  if (me) {
    if (me.weapon) {
      G.weapon = me.weapon;
      updateWeaponHUD(G.weapon);
    }
    const wasDead = G.isDead;
    G.health = me.health;
    G.isDead = me.health <= 0;
    if (G.isDead) {
      G.timeToRevive = me.timeToRevive;
      if (!wasDead) G.reviveTotal = G.timeToRevive;
    } else {
      G.timeToRevive = 0;
    }
    updateHealthHUD();

    const elapsedS = now - G.lastServerSpeedT;
    if (elapsedS >= 200) {
      const dxS = me.x - G.lastServerPx, dyS = me.y - G.lastServerPy;
      const spdS = Math.sqrt(dxS*dxS + dyS*dyS) / (elapsedS / 1000);
      G.lastServerPx = me.x; G.lastServerPy = me.y;
      G.lastServerSpeedT = now;
    }
  }

  
  
  
  if (data.shot && data.shot.length) {
    data.shot.forEach(s => {
      G.shots.push({
        shooterId: s.shooterId,
        fbStartX:  s.startX,
        fbStartY:  s.startY,
        hitId:     s.hittedObjectId,
        endX:      s.endXHitted,
        endY:      s.endYHitted,
        endRX:     s.endXRelative,
        endRY:     s.endYRelative,
        dist:      0,
        rayLen:    RAY_LEN,
        born:      now,
      });
    });
  }
}

function shotStartPoint(s) {
  if (s.shooterId !== undefined && s.shooterId !== null) {
    const ent = findEntityById(s.shooterId);
    if (ent) return { x: ent.x, y: ent.y };
  }
  return { x: s.fbStartX, y: s.fbStartY };
}

function shotEndPoint(s) {
  var ent=null
  if(s.hitId !== undefined){
    ent = findEntityById(s.hitId);
  }
  if (ent != null && s.hitId !== -1) {
    
    if (ent) {
      
      return { x: ent.x + s.endRX, y: ent.y + s.endRY };
    }
  }
  return { x: s.endX, y: s.endY };
}







function sampleByIndex(idx, frac) {
  const snaps = G.snapshots;
  if (snaps.length === 0) return null;
  if (snaps.length === 1) {
    const s = snaps[0];
    return { self: s.me, others: [...s.others.values()] };
  }
  
  if (idx < 0) { idx = 0; frac = 0; }
  if (idx >= snaps.length - 1) {
    
    const s = snaps[snaps.length - 1];
    return { self: s.me, others: [...s.others.values()] };
  }
  const t = Math.max(0, Math.min(1, frac));
  return interpFromSnaps(snaps[idx], snaps[idx + 1], t);
}

function interpFromSnaps(a, b, t) {
  let self = null;
  if (a.me && b.me) {
    
    
    const dx = b.me.x - a.me.x, dy = b.me.y - a.me.y;
    if (dx*dx + dy*dy > TELEPORT_DIST*TELEPORT_DIST) {
      self = { id: b.me.id, x: b.me.x, y: b.me.y, rotation: b.me.rotation, poly: b.me.poly };
    } else {
      self = {
        id:       b.me.id,
        x:        a.me.x + dx * t,
        y:        a.me.y + dy * t,
        rotation: lerpAngle(a.me.rotation, b.me.rotation, t),
        poly:     b.me.poly,
      };
    }
  } else if (b.me) {
    self = { ...b.me };
  }

  const others = [];
  b.others.forEach((pb, id) => {
    const pa = a.others.get(id);
    if (pa) {
      const dx = pb.x - pa.x, dy = pb.y - pa.y;
      if (dx*dx + dy*dy > TELEPORT_DIST*TELEPORT_DIST) {
        others.push({ id, name: pb.name, x: pb.x, y: pb.y, rotation: pb.rotation, poly: pb.poly });
      } else {
        others.push({
          id,
          name:     pb.name,
          x:        pa.x + dx * t,
          y:        pa.y + dy * t,
          rotation: lerpAngle(pa.rotation, pb.rotation, t),
          poly:     pb.poly,
        });
      }
    } else {
      others.push({ ...pb });
    }
  });
  return { self, others };
}







function frame(now) {
  requestAnimationFrame(frame);

  const dt = Math.min((now - G.prevFrame) / 1000, 0.08);
  G.prevFrame = now;

  
  
  
  
  if (now - G.lastInputSentT >= INPUT_MS) {
    G.lastInputSentT = now;
    tick();
  }

  
  G.fpsCount++;
  if (now - G.fpsTimer >= 1000) {
    $('h-fps').textContent = G.fpsCount;
    G.fpsCount = 0; G.fpsTimer = now;
    
    
    const srvHz = G.serverDt > 0 ? (1000 / G.serverDt).toFixed(0) : '—';

  }

  
  
  
  
  
  let sample = null;
  if (G.ready && G.snapshots.length > 0) {
    
    
    
    const headIdx = Math.max(0, G.snapshots.length - 1 - G.targetInterpTicks);

    
    
    
    let speed = 1.0;
    const lag = G.playIdx - headIdx;
    if      (lag < -1) speed = PLAYBACK_CATCHUP;
    else if (lag >  1) speed = PLAYBACK_SLOWDOWN;

    const advanceTicks = (dt * 1000 / G.serverDt) * speed;
    G.playFrac += advanceTicks;
    while (G.playFrac >= 1.0) {
      G.playFrac -= 1.0;
      G.playIdx  += 1;
    }
    
    const maxIdx = G.snapshots.length - 2; 
    if (G.playIdx > maxIdx) { G.playIdx = maxIdx; G.playFrac = 0; }
    if (G.playIdx < 0)      { G.playIdx = 0;      G.playFrac = 0; }

    sample = sampleByIndex(G.playIdx, G.playFrac);
  }

  let others = [];
  if (sample) {
    others = sample.others;
    if (sample.self) {
      G.px = sample.self.x;
      G.py = sample.self.y;
      G.polyOff = sample.self.poly || G.polyOff;
    }

    
    
    
    
    if (G.W > 0 && G.H > 0) {
      const mxw =  (G.mX - G.W/2) / SCALE;
      const myw = -((G.mY - G.H/2) / SCALE);
      G.rotation = Math.atan2(myw, mxw);
    } else if (sample.self) {
      G.rotation = sample.self.rotation;
    }
  }

  
  renderedSelf   = G.ready ? { x: G.px, y: G.py } : null;
  renderedOthers = others;

  
  if (G.ready) {
    const elapsed = now - G.lastSpeedT;
    if (elapsed >= 200) {
      const dxC = G.px - G.lastDrawnPx, dyC = G.py - G.lastDrawnPy;
      const spd = Math.sqrt(dxC*dxC + dyC*dyC) / (elapsed/1000);
      G.lastDrawnPx = G.px; G.lastDrawnPy = G.py;
      G.lastSpeedT = now;
    }

    
    
    
    
    if (G.camInitialized) {
      const dx = G.px - G.camX, dy = G.py - G.camY;
      if (dx*dx + dy*dy > 9) {
        
        G.camX = G.px; G.camY = G.py;
      } else {
        
        
        const k = Math.min(1, dt * 60);
        G.camX += dx * k;
        G.camY += dy * k;
      }
    } else {
      G.camX = G.px; G.camY = G.py;
      G.camInitialized = true;
    }
  }

  
  G.shots.forEach(s => { s.dist += RAY_SPEED * dt; });
  G.shots = G.shots.filter(s => {
    const sp = shotStartPoint(s);
    const ep = shotEndPoint(s);
    const dxR = ep.x - sp.x, dyR = ep.y - sp.y;
    s._sx = sp.x; s._sy = sp.y;
    s._maxDist = Math.sqrt(dxR*dxR + dyR*dyR);
    s._ndx = s._maxDist > 0.0001 ? dxR / s._maxDist : 0;
    s._ndy = s._maxDist > 0.0001 ? dyR / s._maxDist : 0;
    s._ex = ep.x; s._ey = ep.y;
    return (s.dist - s.rayLen) < s._maxDist;
  });

  
  const W = G.W, H = G.H;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#090b0f'; ctx.fillRect(0, 0, W, H);

  const cx = W/2 - G.camX * SCALE;
  const cy = H/2 + G.camY * SCALE;

  drawGrid(cx, cy, W, H);
  drawOrigin(cx, cy);
  drawWalls(cx, cy);

  others.forEach(p => drawPlayer(p.x, p.y, p.poly, p.name, p.id, false, cx, cy, p.rotation ?? 0));
  if (G.ready) drawPlayer(G.px, G.py, G.polyOff, G.nick, G.myId, true, cx, cy, G.rotation || 0);
  drawShots(cx, cy);
  updatePList();
}




const C = {
  grid:'#0f1820', gbig:'#142030',
  me:'#00e5ff',   meb:'#007aaa',
  ot:'#ff3c5f',   otb:'#aa1a30',
  hit:'#ff5588',
  txt:'#c8d8e8',
  
  wallFill:   'rgba(20, 38, 58, 0.92)',
  wallStroke: '#2a4a6a',
  wallGlow:   'rgba(0, 180, 255, 0.12)',
  wallEdge:   '#1e8ab4',
};

function drawGrid(cx, cy, W, H) {
  const s = SCALE, s5 = s*5;
  ctx.lineWidth = 0.5; ctx.strokeStyle = C.grid;
  const ox=((cx%s)+s)%s, oy=((cy%s)+s)%s;
  for (let x=ox; x<W; x+=s) seg(x,0,x,H);
  for (let y=oy; y<H; y+=s) seg(0,y,W,y);
  ctx.lineWidth = 0.8; ctx.strokeStyle = C.gbig;
  const ox5=((cx%s5)+s5)%s5, oy5=((cy%s5)+s5)%s5;
  for (let x=ox5; x<W; x+=s5) seg(x,0,x,H);
  for (let y=oy5; y<H; y+=s5) seg(0,y,W,y);
}

function drawOrigin(cx, cy) {
  ctx.strokeStyle='#1e2d40'; ctx.lineWidth=1;
  seg(cx-8,cy,cx+8,cy); seg(cx,cy-8,cx,cy+8);
}






function drawWalls(cx, cy) {
  if (!G.walls.length) return;

  for (const wall of G.walls) {
    const verts = wall.verts;
    if (verts.length < 3) continue;

    
    
    const sv = verts.map(v => ({
      sx: cx + v.x * SCALE,
      sy: cy - v.y * SCALE,
    }));

    
    ctx.beginPath();
    ctx.moveTo(sv[0].sx, sv[0].sy);
    for (let i = 1; i < sv.length; i++) ctx.lineTo(sv[i].sx, sv[i].sy);
    ctx.closePath();
    ctx.strokeStyle = C.wallGlow;
    ctx.lineWidth = 6;
    ctx.lineJoin = 'round';
    ctx.stroke();

    
    ctx.beginPath();
    ctx.moveTo(sv[0].sx, sv[0].sy);
    for (let i = 1; i < sv.length; i++) ctx.lineTo(sv[i].sx, sv[i].sy);
    ctx.closePath();
    ctx.fillStyle = C.wallFill;
    ctx.fill();

    
    ctx.strokeStyle = C.wallStroke;
    ctx.lineWidth = 1;
    ctx.lineJoin = 'miter';
    ctx.stroke();

    
    
    ctx.beginPath();
    ctx.moveTo(sv[0].sx, sv[0].sy);
    ctx.lineTo(sv[1].sx, sv[1].sy);
    ctx.strokeStyle = C.wallEdge;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    
    if (wall.id !== undefined && wall.id !== null) {
      const scx = cx + wall.cx * SCALE;
      const scy = cy - wall.cy * SCALE;
      ctx.font = '400 9px Share Tech Mono';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0, 229, 255, 0.55)';
      ctx.fillText('#' + wall.id, scx, scy);
      ctx.textBaseline = 'alphabetic';
    }
  }
}

function drawShots(cx, cy) {
  G.shots.forEach(s => {
    const maxDist  = s._maxDist || 0;
    const frontDist = Math.min(s.dist, maxDist);
    const tailDist  = Math.max(0, s.dist - s.rayLen);

    const fx = s._sx + s._ndx * frontDist;
    const fy = s._sy + s._ndy * frontDist;
    const tx = s._sx + s._ndx * tailDist;
    const ty = s._sy + s._ndy * tailDist;

    const sfx = cx + fx * SCALE, sfy = cy - fy * SCALE;
    const stx = cx + tx * SCALE, sty = cy - ty * SCALE;

    const overDist = s.dist - maxDist;
    const fade = overDist <= 0 ? 1.0 : Math.max(0, 1 - overDist / s.rayLen);

    const isHit = s.hitId !== undefined && s.hitId !== -1;

    const grd = ctx.createLinearGradient(stx, sty, sfx, sfy);
    grd.addColorStop(0, `rgba(255,220,50,0)`);
    grd.addColorStop(0.4, `rgba(255,200,80,${0.18 * fade})`);
    grd.addColorStop(1,   isHit
      ? `rgba(255,120,150,${0.55 * fade})`
      : `rgba(255,255,160,${0.45 * fade})`);
    ctx.beginPath(); ctx.moveTo(stx,sty); ctx.lineTo(sfx,sfy);
    ctx.strokeStyle = grd; ctx.lineWidth = 5; ctx.stroke();

    const grd2 = ctx.createLinearGradient(stx, sty, sfx, sfy);
    grd2.addColorStop(0, `rgba(255,180,30,0)`);
    grd2.addColorStop(1, isHit
      ? `rgba(255,180,210,${fade})`
      : `rgba(255,240,120,${fade})`);
    ctx.beginPath(); ctx.moveTo(stx,sty); ctx.lineTo(sfx,sfy);
    ctx.strokeStyle = grd2; ctx.lineWidth = 1.8; ctx.stroke();

    if (overDist <= 0) {
      ctx.beginPath(); ctx.arc(sfx, sfy, 2.2, 0, pi2);
      ctx.fillStyle = isHit ? `rgba(255,200,220,0.95)` : `rgba(255,255,200,0.9)`;
      ctx.fill();
    }

    if (isHit && overDist <= 0) {
      const ex = cx + s._ex * SCALE, ey = cy - s._ey * SCALE;
      ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, pi2);
      ctx.fillStyle = `rgba(255,80,120,${0.6 * fade})`; ctx.fill();
      ctx.strokeStyle = `rgba(255,150,180,${0.9 * fade})`;
      ctx.lineWidth = 1; ctx.stroke();
    }
  });
}

function drawPlayer(wx, wy, polyOff, name, id, isMe, cx, cy, rot) {
  const px = cx + wx*SCALE;
  const py = cy - wy*SCALE;
  const fill = isMe ? C.me  : C.ot;
  const brd  = isMe ? C.meb : C.otb;
  rot = rot || 0;

  
  const cosA = Math.cos(rot), sinA = Math.sin(rot);

  if (polyOff && polyOff.length >= 6) {
    ctx.beginPath();
    for (let i=0; i<polyOff.length; i+=2) {
      
      const lx = polyOff[i], ly = polyOff[i+1];
      const vx = px + lx * SCALE;
      const vy = py - ly * SCALE;
      i===0 ? ctx.moveTo(vx,vy) : ctx.lineTo(vx,vy);
    }
    ctx.closePath();
    ctx.fillStyle=fill+'2a'; ctx.fill();
    ctx.strokeStyle=fill; ctx.lineWidth=isMe?1.5:1; ctx.stroke();
  }


  if (isMe) {
    const fovDeg   = 80;
    const fovRad   = fovDeg * Math.PI / 180;
    const halfFov  = fovRad / 2;
    const coneLen  = 6 * SCALE; 
    const aL = rot + halfFov;
    const aR = rot - halfFov;
    
    const lx = px + Math.cos(aL) * coneLen;
    const ly = py - Math.sin(aL) * coneLen;
    const rx = px + Math.cos(aR) * coneLen;
    const ry = py - Math.sin(aR) * coneLen;

    
    const grdC = ctx.createRadialGradient(px, py, 0, px, py, coneLen);
    grdC.addColorStop(0,   fill + '38');
    grdC.addColorStop(0.6, fill + '14');
    grdC.addColorStop(1,   fill + '00');
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(lx, ly);
    
    
    ctx.arc(px, py, coneLen, -aL, -aR, false);
    ctx.lineTo(px, py);
    ctx.closePath();
    ctx.fillStyle = grdC;
    ctx.fill();

    
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = fill + '70';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(lx, ly);
    ctx.moveTo(px, py); ctx.lineTo(rx, ry);
    ctx.stroke();
    ctx.restore();
  }

  ctx.beginPath(); ctx.arc(px,py,isMe?5:4,0,pi2);
  ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle=brd; ctx.lineWidth=1.5; ctx.stroke();

  
  
  const dirLen = (isMe ? 0.55 : 0.45) * SCALE;
  const dx = cosA * dirLen;
  const dy = sinA * dirLen;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + dx, py - dy);
  ctx.strokeStyle = fill;
  ctx.lineWidth = isMe ? 2 : 1.5;
  ctx.stroke();

  if (isMe) {
    ctx.beginPath(); ctx.arc(px,py,13,0,pi2);
    ctx.strokeStyle=fill+'35'; ctx.lineWidth=1; ctx.stroke();
  }

  ctx.font=(isMe?'700':'400')+' 11px Share Tech Mono';
  ctx.fillStyle=isMe?C.me:C.txt;
  ctx.textAlign='center';
  ctx.fillText((isMe?'▶ ':'')+name, px, py-15);

  if (id !== undefined && id !== null) {
    ctx.font='400 9px Share Tech Mono';
    ctx.fillStyle = C.txt + '88';
    ctx.fillText('#'+id, px, py-26);
  }
}

function seg(x1,y1,x2,y2) {
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}




function updatePList() {
  
  const entries = G.scoreNames.map((name, i) => ({
    name,
    score: G.scoreValues[i] ?? 0,
  }));

  
  entries.sort((a, b) => b.score - a.score);

  
  $('ponline').textContent = entries.length + ' online';

  const b = $('plb');
  b.innerHTML = '';

  const rankSymbols = ['#1', '#2', '#3'];
  const rankClasses = ['gold', 'silver', 'bronze'];

  entries.forEach((p, idx) => {
    const isMe = p.name === G.nick;
    const d = document.createElement('div');
    d.className = 'pe' + (isMe ? ' is-me' : '');

    const rankLabel  = idx < 3 ? rankSymbols[idx] : `#${idx + 1}`;
    const rankClass  = idx < 3 ? rankClasses[idx] : '';
    const dot = `<div class="${isMe ? 'pdm' : 'pdo'}"></div>`;
    const rank = `<span class="prank ${rankClass}">${rankLabel}</span>`;
    const name = `<span class="pn">${p.name}</span>`;
    const score = `<span class="pscore">${p.score}</span>`;

    d.innerHTML = dot + rank + name + score;
    b.appendChild(d);
  });
}

function killfeed(msg) {
  const e = document.createElement('div');
  e.className='km'; e.textContent=msg;
  $('kf').appendChild(e);
  setTimeout(() => e.remove(), 3200);
}
